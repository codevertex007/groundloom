name: Groundloom CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,documents]"
      - run: python -m ruff check backend/app backend/tests backend/scripts
      - run: python -m mypy backend/app backend/scripts --ignore-missing-imports
      - run: python -m pytest backend/tests -q
      - run: python backend/scripts/validate_docs.py
      - run: python backend/scripts/verify_migrations.py
      - run: python backend/scripts/run_evals.py
      - run: PYTHONPATH=backend python backend/scripts/benchmark_local.py --requests 20
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:components
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,documents]"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  provider-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,agent,postgres,storage,observability]"
      - run: python -m pytest backend/tests/test_optional_provider_contracts.py -q

  deployment-integration:
    runs-on: ubuntu-latest
    env:
      GROUNDLOOM_ENV: staging
      GROUNDLOOM_DATABASE_URL: postgresql+psycopg://groundloom_api:groundloom-api-local-only@localhost:5432/groundloom
      GROUNDLOOM_WORKER_DATABASE_URL: postgresql+psycopg://groundloom_worker:groundloom-worker-local-only@localhost:5432/groundloom
      GROUNDLOOM_MIGRATION_DATABASE_URL: postgresql+psycopg://groundloom_migrator:groundloom-migrator-local-only@localhost:5432/groundloom
      GROUNDLOOM_CHECKPOINT_BACKEND: postgres
      GROUNDLOOM_OBJECT_STORE_BACKEND: s3
      GROUNDLOOM_OBJECT_STORE_BUCKET: groundloom
      GROUNDLOOM_OBJECT_STORE_ENDPOINT: http://localhost:9000
      GROUNDLOOM_OBJECT_STORE_ACCESS_KEY: groundloom
      GROUNDLOOM_OBJECT_STORE_SECRET_KEY: groundloom-local-only
      GROUNDLOOM_OBJECT_STORE_SSE_MODE: none
      GROUNDLOOM_RETRIEVAL_INDEX_BACKEND: pgvector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,agent,postgres,storage]"
      # postgres/minio are long-running services `--wait` can watch for a
      # healthy state; minio-init is a one-shot bucket-creation container
      # that's expected to exit(0) once done, which `--wait` treats as a
      # failed service rather than a completed one. Wait on the two real
      # services, then run the init container separately so its own exit
      # is the (blocking, but not misclassified) checkpoint for step 3.
      - run: docker compose up -d postgres minio --wait
      - run: docker compose up minio-init
      - run: python backend/scripts/migrate.py
      - run: python -m pytest backend/tests/test_postgres_deployment_integration.py -q -rA
      - if: always()
        run: docker compose down -v
