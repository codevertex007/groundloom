name: Groundloom CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,documents]"
      - run: python -m ruff check backend/app backend/tests
      - run: python -m mypy backend/app --ignore-missing-imports
      - run: python -m pytest backend/tests -q
      - run: python backend/scripts/validate_docs.py
      - run: python backend/scripts/verify_migrations.py
      - run: python backend/scripts/run_evals.py
      - run: PYTHONPATH=backend python backend/scripts/benchmark_local.py --requests 20
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev

  provider-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,agent,postgres,storage,observability]"
      - run: python -m pytest backend/tests/test_optional_provider_contracts.py -q
