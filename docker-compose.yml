services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: groundloom
      POSTGRES_USER: groundloom
      POSTGRES_PASSWORD: groundloom-local-only
    ports:
      - "5432:5432"
    volumes:
      - groundloom-postgres:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: groundloom
      MINIO_ROOT_PASSWORD: groundloom-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - groundloom-minio:/data
volumes:
  groundloom-postgres:
  groundloom-minio:

