[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "groundloom"
version = "0.1.0"
description = "Source-grounded knowledge production studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
documents = ["pypdf>=5,<6", "python-docx>=1.1,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]
agent = [
  "deepagents==0.7.8",
  "langgraph-checkpoint-postgres==3.1.2",
  "langchain-openai==1.6.0",
  "langchain-anthropic==1.6.1",
  "langchain-google-genai==4.3.5",
]
observability = ["langfuse==4.14.5"]
storage = ["boto3>=1.35,<2"]

[tool.setuptools.packages.find]
where = ["backend", "packages/groundloom-agent-harness/src"]

[tool.setuptools.package-data]
"app.ai.prompts" = ["*.txt"]

[tool.pytest.ini_options]
pythonpath = ["backend", "packages/groundloom-agent-harness/src"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
